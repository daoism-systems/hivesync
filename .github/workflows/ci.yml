name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # The e2e suite (tests/e2e) spins up two processes that talk over the REAL
    # public Logos/Waku fleet — live external infra that is intermittently
    # unreachable (LightPush "delivered to 0 peers"), which flakes CI. The suite
    # honors HIVESYNC_SKIP_E2E and skips itself when set. We skip it everywhere
    # it would otherwise run (`npm test`, `test:e2e`, `coverage` all invoke jest
    # over the whole tree); run it locally/manually for real-network checks.
    env:
      HIVESYNC_SKIP_E2E: '1'

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Lint
      run: npm run lint
    
    # One pass over unit + integration (e2e self-skips, see above), with
    # coverage — `npm test` / `test:integration` would just re-run the same suites.
    - name: Run tests with coverage
      run: npm run coverage
    
    - name: Upload coverage to Codecov
      if: matrix.node-version == '22.x'
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage/lcov.info
        # Coverage upload is informational; don't fail the build on a Codecov
        # outage or tokenless-upload rate limit (429). Add a CODECOV_TOKEN repo
        # secret to make uploads reliable if gating on coverage is ever wanted.
        fail_ci_if_error: false

  publish:
    needs: test
    runs-on: ubuntu-latest
    # Publish only on version tags (`git tag v2.1.0 && git push origin v2.1.0`);
    # every push to main would otherwise re-publish the same version and fail.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      id-token: write   # npm provenance (publishConfig.provenance)
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'
        registry-url: 'https://registry.npmjs.org'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Check tag matches package.json version
      run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
    
    - name: Publish to npm
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
